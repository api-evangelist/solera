self_serve: false
self_serve_note: |
  There is no self-serve sandbox. Credentials are not issued from a portal — an Audatex
  account representative provisions a client into the demo/UAT environment as part of the
  7-step onboarding, and the client must operate "a segregated development and test
  environment to complete Integration testing and UAT." What is publicly available
  without credentials is the demo API host's Swagger UI, its machine-readable specs, and
  the example record identifiers below.
