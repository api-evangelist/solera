cross_cutting_rules:
- No idempotency key exists on any operation — deduplicate before you POST.
- Callback delivery is at-least-once (3 retries); every receiver must be idempotent.
- Callbacks carry no signature; authenticate with the credentials you issued in
  responseRoute.authorization and allowlist the Audatex egress IPs.
- Errors are bare status codes with prose descriptions — no problem+json, no error body
  schema, no 404/429/5xx declared anywhere.
- Documents and images are always Base64 in body.payload, never binary streams.
- Availability is a published hours-of-operation window, not an uptime SLA, and there is no
  status page.
