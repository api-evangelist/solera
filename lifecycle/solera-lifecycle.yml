deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  note: |
    No deprecation policy, no Sunset or Deprecation header support, and no end-of-life
    schedule appears in any Solera or Audatex public integration document. Older major
    versions are simply left served (Assignment 1.0, GetDocuments 1.0, GetImage 1.0
    still return 200) with no stated retirement commitment. No `Deprecation` pointer is
    emitted because no policy is published.
