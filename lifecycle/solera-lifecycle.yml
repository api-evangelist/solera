generated: '2026-07-25'
method: searched
source: |
  Audatex Estimate Document Return API Integration Guide (PDF, sections 9-12), Claim
  Image Document Return API Integration Guide (PDF), GIC - Image Capture API Integration
  Guide (DOCX), and the version surfaces declared in openapi/*.json.
versioning:
  scheme: uri-path
  detail: |
    Version is carried in the URI path (/api/v1/..., /api/v2/...). Several surfaces
    additionally template the segment as /api/v{version}/ and require an explicit
    api-version parameter — as a query parameter on the GetDocuments and ClaimImages
    production surfaces (default "2.0") and as a header on the GetImage surface.
  current:
  - api: Solera Dashboard Assignment API
    version: '2.0'
    older_still_served: '1.0'
  - api: ClaimImages API
    version: '2.0'
  - api: Audatex GetDocuments API
    version: '2.0'
    older_still_served: '1.0'
  - api: Audatex Assignment Get Document API (GetImage)
    version: '2.0'
    older_still_served: '1.0'
  - api: EAPI Get Document API
    version: '2.0'
  - api: EAPI GIC Integration API
    version: '1.0'
  version_endpoints:
  - openapi/solera-getdocuments-v1-openapi.json#GET /api/Version
  - openapi/solera-gic-integration-openapi.json#GET /api/Version
  - openapi/solera-getimage-v2-openapi.json#GET /api/v{version}
  note: Every Swagger UI on the API hosts exposes a version picker listing the versions
    still served side by side, so old major versions are visibly retained rather than
    removed.
