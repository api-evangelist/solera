onboarding_lifecycle:
  steps:
  - Meet pre-requisites (consume and expose JSON/RESTful APIs; segregated dev + test
    environment)
  - Review technical specifications
  - Develop integration services on the client side
  - Establish a secure connection (IP allowlist, VPN, or SSL over the internet)
  - Test connectivity and data flow (System Integration Testing)
  - Complete User Acceptance Testing in the Audatex test environment
  - Go live
