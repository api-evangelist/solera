scheme_note: |
  Solera / Audatex publish no API changelog, no release-notes feed, and no dated "what's
  new" page — there is no developer portal to host one. What IS published is a Revision
  History table at the front of each integration guide, versioning the DOCUMENT rather
  than the API. That is the only dated change record the company exposes publicly, and it
  is captured verbatim here. Version drift in the APIs themselves is only observable by
  diffing the Swagger UI version pickers on api-demo/api-prod.audatex.com.
