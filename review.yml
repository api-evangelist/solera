webhooks:
  present: partial
  asyncapi: false
  note: 'No event catalog and no AsyncAPI document is published. The Estimate Document

    Return integration is nonetheless callback-shaped: Audatex Integrations

    authenticates against a CLIENT-hosted API and POSTs a HATEOAS message to a

    client-specified endpoint when an estimate completes, after which the client

    performs an HTTP GET to retrieve the referenced documents. That is a real

    outbound push pattern, documented only in PDF prose, with no machine-readable

    event schema.

    '
