acord:
  posture: no ACORD reference found — CIECA BMS 5.7 instead
  evidence: 'No occurrence of ACORD, AL3, ACORD XML, NGDS, IVANS, agency download, Applied

    Epic or Vertafore AMS360 was found on solera.com, on na.api.solera.com, in the

    three harvested OpenAPI documents, or in the Estimate Document Return and Claim

    Image Document Return integration guides. Solera''s published standards alignment

    is CIECA, the auto physical damage sector''s analogue to ACORD. The Estimate

    Document Return API Integration Guide states verbatim: "Audatex is a Corporate

    Technology member of Collision Industry Electronic Commerce Association (''CIECA'')

    and is licensed to use CIECA standards in its products." It further notes the

    Audatex Estimate Return data mapping is derived from, but does not fully implement,

    the CIECA BMS, and points integrators to the BMS 5.7 schema files on cieca.com.

    '
  standardsBody: CIECA (Collision Industry Electronic Commerce Association)
  membership: Corporate Technology member (self-documented)
  schema: CIECA BMS 5.7
  source: https://na.api.solera.com/files/Estimate%20Return%20API.pdf
insuranceVerbs:
  quote: false
  bind: false
  issue: false
  fnol: true
  note: 'Solera is a claims-technology vendor, not a carrier, so quote/bind/issue do not

    apply — there is no rating, quoting, or policy issuance surface. First notice of

    loss IS exposed: the Dashboard Assignment API creates assignments and returns

    estimate return responses, and the OAuth authorization server advertises

    b2b.fnol.api, gofnol.api, b2b.fnol.documents and b2b.fnol.transformer scopes.

    The audience is partner-only — insurer claim management systems, bodyshop

    management systems, and TPAs, provisioned by a Solera account representative.

    Not consumer-facing and not open agent-facing self-serve.

    '
