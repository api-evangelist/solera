enrichment:
  date: '2026-07-25'
  round: 2
  notes: 'Contract discovery was re-run against every baseURL host, every OpenAPI servers[] host
    and the docs hosts. Four API surfaces that round 1 missed were found and harvested verbatim,
    all anonymously readable: the Audatex GetDocuments API (1.0 and 2.0), the Audatex Assignment
    Get Document API / GetImage (1.0 and 2.0), the EAPI Get Document API, and Swagger 2.0 production
    variants of the Assignment and ClaimImages APIs that carry operationIds the demo OpenAPI documents
    omit. The production host api-prod.audatex.com serves the same anonymous Swagger UI and specifications
    as api-demo. The PRODUCTION Audatex IdentityServer at dispatch-login.audatex.com also serves
    anonymous OIDC discovery (200) and JWKS. The three publicly readable integration guides were
    parsed in full and yielded a real callback/event surface, availability hours, retry semantics
    and published test identifiers.'
  specs_total: 10
  apis_total: 6
  new_surfaces:
  - name: Audatex GetDocuments API
    url: https://api-prod.audatex.com/GetDocuments/docs/index.html
    httpStatus: 200
    versions:
    - '1.0'
    - '2.0'
  - name: Audatex Assignment Get Document API (GetImage)
    url: https://api-prod.audatex.com/GetImage/docs/index.html
    httpStatus: 200
    versions:
    - '1.0'
    - '2.0'
  - name: EAPI Get Document API
    url: https://api-demo.audatex.com/TestGetDocumentapi/docs/index.html
    httpStatus: 200
    versions:
    - '2.0'
  - name: Solera Enterprise API (production Swagger 2.0)
    url: https://api-prod.audatex.com/TestAssignmentapi/docs/swaggerjson/v2
    httpStatus: 200
  - name: ClaimImages API (production Swagger 2.0)
    url: https://api-prod.audatex.com/TestClaimImageapi/docs/swaggerjson/v2
    httpStatus: 200
  - name: Production IdentityServer OIDC discovery
    url: https://dispatch-login.audatex.com/.well-known/openid-configuration
    httpStatus: 200
  negative_findings:
  - No first-party SDK, CLI or client library on npm, PyPI, NuGet or any registry probed.
  - github.com/solera, github.com/Audatex and github.com/SOLERAGLOBAL are empty placeholder user
    accounts (0 public repos) — not a company GitHub organization.
  - No MCP server, no llms.txt, no /.well-known/ai-plugin.json, no api-catalog.
  - No security.txt on any host; no trust center, no published certifications, no bug bounty or responsible-disclosure
    page. /security/ and /trust/ 404; trust.solera.com and security.solera.com do not resolve.
  - No status page (status.solera.com and status.audatex.com do not resolve); availability is published
    as hours of operation, not an uptime SLA.
  - No deprecation policy, no Sunset header, no rate limits, no idempotency key, no RFC 9457 problem
    details.
  - No public Postman workspace or collection.
  - No GraphQL or gRPC surface on any host probed.
  gateway: Kong 3.4.3 enterprise fronts api-demo/api-prod.audatex.com (Via and X-Kong-* response
    headers).
