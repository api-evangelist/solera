openapi: 3.2.0
info:
  title: Solera Assignment API
  version: '2.0'
  contact:
    name: Solera
    url: http://www.audatex.us/product.asp?pageid=zContact_us
  license:
    name: '@SoleraNorth America, Inc. All rights reserved'
    url: http://www.audatex.us/
  description: 'Operations tagged Assignment across 2 of this provider''s published API definitions: solera-dashboard-assignment-openapi.json, solera-enterprise-assignment-prod-swagger.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /TestAssignmentapi
tags:
- name: Assignment
paths:
  /api/v2/assignments:
    post:
      tags:
      - Assignment
      summary: Creates a new assignment
      operationId: AddAssignment
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/AddAssignmentRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssignmentRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/AddAssignmentRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/AddAssignmentRequest'
      responses:
        '201':
          description: Add assignment request was received
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AddAssignmentRequest'
            application/json:
              schema:
                $ref: '#/components/schemas/AddAssignmentRequest'
            text/json:
              schema:
                $ref: '#/components/schemas/AddAssignmentRequest'
        '400':
          description: The assignment data is invalid
        '401':
          description: The authentication token is either missing or invalid
      security:
      - oauth2:
        - readAccess
        - writeAccess
    servers:
    - url: /TestAssignmentapi
  /api/v2/assignmentRequestMessage:
    get:
      tags:
      - Assignment
      summary: Get Sample Assignment Message
      responses:
        '200':
          description: Success
      security:
      - oauth2:
        - readAccess
        - writeAccess
    servers:
    - url: /TestAssignmentapi
  /api/v2/assignmentAcks:
    post:
      tags:
      - Assignment
      summary: Sample AssignmentAcks Response
      responses:
        '200':
          description: Success
      security:
      - oauth2:
        - readAccess
        - writeAccess
    servers:
    - url: /TestAssignmentapi
