- aid: solera:solera-getimage-api
  name: Audatex Assignment Get Document API (GetImage)
  description: Claim image document retrieval. The claim-image callback publishes a HATEOAS link
    into this surface, and the client GETs the referenced document by locator. Version 1.0 exposes
    the claim-document-by-locator operation; version 2.0 exposes a version endpoint. OpenAPI 3.0.1,
    and the only Solera surface that declares its bearer credential as an apiKey-style Authorization
    header scheme rather than an oauth2 scheme, with the API version carried in an api-version request
    header. Served anonymously from the Swagger UI on both the demo and production hosts.
  humanURL: https://api-prod.audatex.com/GetImage/docs/index.html
  baseURL: https://api-prod.audatex.com/GetImage
