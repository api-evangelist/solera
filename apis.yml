name: Solera
kind: company
description: Solera is a Westlake, Texas headquartered vehicle lifecycle management
  software, data, and services company operating in more than 100 countries, and one
  of the claims-technology intermediaries that sits between property and casualty insurers
  and the repair, salvage, and fleet economy rather than underwriting risk itself. Its
  insurance-facing business is automobile physical damage claims — first notice of loss
  intake, photo and AI damage assessment, repair cost estimating, total loss valuation,
  parts sourcing, and claims workflow — delivered through the Audatex and Qapter brands
  alongside Vehicle Repair (Identifix, Autodata, Hollander), Dealer Solutions (DealerSocket,
  cap hpi), and Fleet Solutions (Omnitracs, SmartDrive, eDriving) divisions. Its API
  posture is characteristic of the United States insurance market seam — there is no
  self-serve developer portal on solera.com, no signup, and no public API key. The
  Solera Integrations portal at na.api.solera.com returns HTTP 200 to an Audatex user
  ID and password login wall, and onboarding is a provisioned B2B integration run through
  a Solera account representative with a kickoff meeting and UAT. What is genuinely public
  is a set of anonymously readable Swagger UI reference pages and machine readable
  OpenAPI 3.0.1 documents on the Audatex demo API host, plus PDF integration guides on
  na.api.solera.com/files, covering assignment dispatch and first notice of loss, claim
  image retrieval, and GIC integration. Authentication is OAuth 2.0 against an IdentityServer
  discovery document at dispatch-login-demo.audatex.com with resource scopes including
  b2b.fnol.api, gofnol.api, estimatics.api, and hqclaims.api. Solera does not reference
  ACORD anywhere in its public integration documentation. Its published standards alignment
  is CIECA instead — Audatex is documented as a Corporate Technology member of the Collision
  Industry Electronic Commerce Association and licensed to use CIECA standards, with the
  BMS 5.7 schema as the data mapping baseline for estimate return, which is the auto physical
  damage sector's analogue to ACORD rather than ACORD itself.
