apis:
- aid: solera:solera-dashboard-assignment-api
  name: Solera Dashboard Assignment API
  description: Assignment dispatch and first notice of loss intake for automobile physical damage
    claims. Creates a new assignment, retrieves a sample assignment request message, posts assignment
    acknowledgements, and generates an estimate return response. OpenAPI 3.0.1, secured with OAuth
    2.0 against the Audatex IdentityServer using the b2b.fnol.api scope. Partner facing — an Audatex
    or Solera B2B account must be provisioned before the endpoints can be called.
  humanURL: https://api-demo.audatex.com/TestAssignmentapi/docs/index.html
  baseURL: https://api-demo.audatex.com/TestAssignmentapi
  tags:
  - Claims
  - FNOL
  - Assignment
  - Insurance
  - Automotive
  properties:
  - type: OpenAPI
    url: openapi/solera-dashboard-assignment-openapi.json
  - type: Documentation
    url: https://na.api.solera.com/files/Estimate%20Return%20API.pdf
  - type: APIReference
    url: https://api-demo.audatex.com/TestAssignmentapi/docs/index.html
