- aid: solera:solera-getdocuments-api
  name: Audatex GetDocuments API
  description: 'Document and valuation retrieval for automobile physical damage claims. This is the
    surface the estimate-complete callback links point at: given an assignment identifier and a document
    locator, it returns the estimate XML, print image or attachment Base64-encoded inside a header/body
    envelope, with body.dataType describing how to decode it. Version 1.0 serves document-by-id,
    claim-document-by-locator, valuation-by-id and a version endpoint; version 2.0 narrows to a valuation
    document by type and process id. OpenAPI 3.0.1, secured with OAuth 2.0 using the b2b.fnol.documents
    scope. Both versions are served anonymously from the Swagger UI on the demo and production hosts.'
  humanURL: https://api-prod.audatex.com/GetDocuments/docs/index.html
  baseURL: https://api-prod.audatex.com/GetDocuments
  tags:
  - Claims
  - Documents
  - Valuation
  - Insurance
  - Automotive
  properties:
