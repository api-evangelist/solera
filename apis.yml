apis:
- aid: solera:solera-dashboard-assignment-api
  name: Solera Dashboard Assignment API
  description: Assignment dispatch and first notice of loss intake for automobile physical
    damage claims. Creates a new assignment, retrieves a sample assignment request message,
    posts assignment acknowledgements, and generates an estimate return response. OpenAPI
    3.0.1, secured with OAuth 2.0 against the Audatex IdentityServer using the b2b.fnol.api
    scope. Partner facing — an Audatex or Solera B2B account must be provisioned before
    the endpoints can be called.
  humanURL: https://api-demo.audatex.com/TestAssignmentapi/docs/index.html
  baseURL: https://api-demo.audatex.com/TestAssignmentapi
  tags:
  - Claims
  - FNOL
  - Assignment
  - Insurance
  - Automotive
  properties:
  - type: OpenAPI
    url: openapi/solera-dashboard-assignment-openapi.json
  - type: Documentation
    url: https://na.api.solera.com/files/Estimate%20Return%20API.pdf
  - type: APIReference
    url: https://api-demo.audatex.com/TestAssignmentapi/docs/index.html
  - type: Authentication
    url: https://dispatch-login-demo.audatex.com/.well-known/openid-configuration
- aid: solera:solera-claim-images-api
  name: Solera ClaimImages API
  description: Retrieval of claim images and decoded document files attached to an automobile
    damage claim, used by insurer claim management systems consuming Audatex claim
    documentation. Two documented operations returning an image by ClaimImage identifier
    and a decoded file. OpenAPI 3.0.1, secured with OAuth 2.0 bearer tokens issued by
    the Audatex IdentityServer.
  humanURL: https://api-demo.audatex.com/TestClaimImageapi/docs/index.html
  baseURL: https://api-demo.audatex.com/TestClaimImageapi
  tags:
  - Claims
  - Images
  - Documents
  - Insurance
  - Automotive
  properties:
  - type: OpenAPI
    url: openapi/solera-claim-images-openapi.json
  - type: Documentation
    url: https://na.api.solera.com/files/ClaimImage%20Return%20API.pdf
  - type: APIReference
    url: https://api-demo.audatex.com/TestClaimImageapi/docs/index.html
  - type: Authentication
    url: https://dispatch-login-demo.audatex.com/.well-known/openid-configuration
- aid: solera:solera-gic-integration-api
  name: Solera EAPI GIC Integration API
  description: Global Integration Component endpoint used to post GIC integration payloads
    against a work assignment identifier, acknowledge M31 events, and report the deployed
    API version. OpenAPI 3.0.1, secured with OAuth 2.0 bearer tokens issued by the Audatex
    IdentityServer. Partner facing integration surface for claim image capture workflows.
  humanURL: https://api-demo.audatex.com/TestGICapi/docs/index.html
  baseURL: https://api-demo.audatex.com/TestGICapi
  tags:
  - Claims
  - Integration
  - Insurance
