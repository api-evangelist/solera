    url: https://dispatch-login-demo.audatex.com/.well-known/openid-configuration
  - type: OpenAPI
    url: openapi/solera-enterprise-assignment-prod-swagger.json
    name: Solera Enterprise API (production, Swagger 2.0)
    description: 'Production variant served anonymously at https://api-prod.audatex.com/TestAssignmentapi/docs/swaggerjson/v2.
      Swagger 2.0 rather than OpenAPI 3.0.1, and richer than the demo document: it carries an operationId
      on every operation (AddAssignment, AssignmentRequestMessage, AssignmentAcks, EstimateReturnResponse)
      and points its token URL at the production IdentityServer.'
