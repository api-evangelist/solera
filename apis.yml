    device_code. Resource scopes include b2b.fnol.api, gofnol.api, b2b.fnol.documents,
    b2b.fnol.transformer, b2b.admin.api, estimatics.api, hqclaims.api, novo.claims.manager,
    novo.estimating, mobile.inspection.api, marketdata.web.api and vinhistory.api.
