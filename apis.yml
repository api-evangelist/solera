- aid: solera:solera-eapi-getdocument-api
  name: Solera EAPI Get Document API
  description: 'Enterprise API document and valuation retrieval, and the best-documented of the Solera
    retrieval surfaces: every operation carries a worked example in its summary, including a real
    assignment identifier, document locator and valuation process id, and every operation declares
    400 and 401 failure cases. Four operations retrieve a document by assignment id and locator,
    a decoded attached image or PDF by type, a valuation document by type and process id, and a decoded
    valuation file. OpenAPI 3.0.1, secured with OAuth 2.0 against the Audatex IdentityServer.'
  humanURL: https://api-demo.audatex.com/TestGetDocumentapi/docs/index.html
  baseURL: https://api-demo.audatex.com/TestGetDocumentapi
