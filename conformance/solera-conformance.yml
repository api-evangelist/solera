standards:
- id: cieca-bms-5.7
  name: CIECA Business Message Suite 5.7
  conforms: partial
  evidence: |
    "Audatex is a Corporate Technology member of Collision Industry Electronic Commerce
    Association ('CIECA') and is licensed to use CIECA standards in its products."
    Assignment and estimate payloads are carried as Base64-encoded CIECA BMS documents
    (AddAssignmentRequestBody.bmsVer = "5.7.0", content = Binary64 encoded BMS
    AssignmentAddRq). The guide is explicit that alignment is partial: "The Audatex
    system does not support all fields available in the CIECA BMS."
  docs: https://www.cieca.com/
- id: acord
  name: ACORD standards
  conforms: false
  evidence: |
    No occurrence of ACORD, AL3, ACORD XML, NGDS or IVANS in any Solera or Audatex
    public integration documentation, portal page, or harvested specification. CIECA
    is the standards body Solera names, not ACORD.
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: true
  evidence: |
    Every harvested spec declares an oauth2 securityScheme. The IdentityServer exposes
    /connect/token, /connect/authorize, /connect/introspect, /connect/revocation and
    /connect/deviceauthorization. grant_types_supported includes authorization_code,
    client_credentials, password, refresh_token, implicit and device_code.
- id: oauth2-client-credentials
  name: OAuth 2.0 client credentials grant
  conforms: true
  evidence: The integration guides document grant_type=client_credentials with client_id
    b2b.fnol and scope b2b.fnol.documents for server-to-server document retrieval.
